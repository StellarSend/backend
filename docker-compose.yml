services:
  api:
    build: .
    ports: ["3000:3000"]
    env_file:
      - .env
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stellarsend
      POSTGRES_USER: stellarsend
      POSTGRES_PASSWORD: password
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata: